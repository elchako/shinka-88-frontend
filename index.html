<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--shinka-head-->
    <noscript><style>[data-js-catalog] { display: none !important; }</style></noscript>
  </head>

  <body>
    <noscript><p class="noscript-note">Для просмотра наличия и интерактивного подбора включите JavaScript.</p></noscript>
    <div id="root"><!--shinka-body--></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Yandex.Metrika counter -->
    <script>
      (() => {
        const loadCounter = () => {
          const src = 'https://mc.yandex.ru/metrika/tag.js?id=104682064';
          if (Array.from(document.scripts).some(script => script.src === src)) return;

          window.ym = window.ym || function () {
            (window.ym.a = window.ym.a || []).push(arguments);
          };
          window.ym.l = Date.now();
          window.ym(104682064, 'init', {ssr:true, webvisor:true, clickmap:true, ecommerce:"dataLayer", accurateTrackBounce:true, trackLinks:true});

          const script = document.createElement('script');
          script.async = true;
          script.src = src;
          document.head.appendChild(script);
        };

        const scheduleCounter = () => {
          if (typeof window.requestIdleCallback === 'function') {
            window.requestIdleCallback(loadCounter, {timeout: 2000});
          } else {
            window.setTimeout(loadCounter, 0);
          }
        };

        if (document.readyState === 'complete') scheduleCounter();
        else window.addEventListener('load', scheduleCounter, {once: true});
      })();
    </script>
    <noscript><div><img src="https://mc.yandex.ru/watch/104682064" style="position:absolute; left:-9999px;" alt="" /></div></noscript>
    <!-- /Yandex.Metrika counter -->
  </body>
</html>
